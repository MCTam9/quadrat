[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sce"
version = "0.1.0"
description = "Site Context Report - urban morphology, terrain, climate and access for any site on earth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vincent" }]
dependencies = [
  "osmnx>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.32",
  "networkx>=3.2",
  "pyarrow>=17",
  "ezdxf>=1.3",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]
rhino = ["rhino3dm>=8.9"]

[project.scripts]
sce = "sce.cli:main"

[tool.setuptools.packages.find]
include = ["sce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "live: allow real network access; runs against live APIs, not CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
