[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sce"
version = "0.1.0"
description = "Site Context Report - urban morphology, terrain, climate and access for any site on earth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vincent" }]
dependencies = [
  "osmnx>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.32",
  "networkx>=3.2",
  "pyarrow>=17",
  "ezdxf>=1.3",
  "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "httpx>=0.27"]
rhino = ["rhino3dm>=8.9"]
# GLB/OBJ meshes: triangulating footprints and terrain.
mesh = ["trimesh>=4.4", "mapbox-earcut>=1.0"]
# The web API (api/main.py). Not needed for the CLI.
web = ["fastapi>=0.115", "uvicorn>=0.30", "pyjwt[crypto]>=2.9"]

[project.scripts]
sce = "sce.cli:main"

[tool.setuptools.packages.find]
include = ["sce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests are opt-in. Without this, a plain `pytest` silently starts hitting
# the network, which is slow, flaky and exactly what the offline suite exists to
# avoid. Run them deliberately with `pytest -m live`.
addopts = "-m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "live: hits real network interfaces; deselected by default, run weekly in CI",
    "slow: takes minutes rather than seconds",
]
[tool.ruff]
# 110 rather than the more common 100: the lines that exceed 100 here are almost
# all type annotations and click decorators, and wrapping those makes them
# harder to read, not easier. Anything genuinely long enough to hurt is still
# caught.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly so CI is deterministic across ruff releases rather than
# inheriting whatever the current default happens to be.
select = ["E", "F", "I", "UP", "B", "SIM", "PERF", "DTZ", "RUF"]
ignore = [
    # Long strings wrapped across lines inside a list are the normal way to
    # write a readable multi-sentence note, and this codebase does it
    # deliberately in every provider's `notes`.
    "ISC001",
    "ISC003",
    "ISC004",
    # Assert is how tests express intent.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Tests unpack fixtures for readability even where one half goes unused.
"tests/*" = ["RUF059", "F841"]
