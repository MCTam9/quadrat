name: Live API checks

# Runs against real, un-mocked APIs (Overpass, STAC, etc). Never gates CI:
# the job is allowed to fail (continue-on-error), and a failure files/updates
# a tracking issue instead of turning the repo red. This is what makes the
# README's "verified working today" claim checked by a machine rather than
# just asserted.
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      outcome: ${{ steps.run_live.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run live tests against real APIs
        id: run_live
        run: pytest -m live -q -rs
        # -rs so the summary names anything skipped. A skip here means a host
        # throttled us; a failure means an interface actually moved.

      - name: File or update tracking issue on failure
        if: steps.run_live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live API checks failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The weekly live API check failed.`,
              ``,
              `Run: ${runUrl}`,
              `Commit: ${context.sha}`,
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["live-check-failure"],
            });
            const existing = issues.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-check-failure"],
              });
            }

      - name: Close tracking issue on success
        if: steps.run_live.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live API checks failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["live-check-failure"],
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Live API checks passed again; closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
